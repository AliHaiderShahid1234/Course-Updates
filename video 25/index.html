<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling Lists in html</title>
</head>
<style>
    nav ul li {
        list-style: none;
        /* list-style-type: "🙉"; */
        /* background-color: yellow; */
        /*list-style-position: inside;*/ /* Very important in navbar deisgn */
        }

    ul {
        display: flex;
        padding: 38px;
    }
</style>
<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
            <!-- A list item comprises of a marker and the list item -->
        </ul>
    </nav>

</body>

</html>
