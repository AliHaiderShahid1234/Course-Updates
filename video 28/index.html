<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position property</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .box {
            height: 133px;
            width: 80vw;
            margin: 3px;
            padding: 3px;
            border: 2px solid black; 
        }
        .box1 {
            position: absolute; /* Position absolute searches for a parent element that is positioned to have a position relative to. If the parent element "parent" in this case isn't positioned (meaning it has position static which is default) the element will search of the next parent element, eventually if no parent element that is positioned is found, the element will position itself relative to the <html> element */
            background-color: aliceblue;
            top: 0;
        }

        .box2 {
            background-color: aquamarine;
            /* position: relative;
            top: 34px;
            left: 56px; */
        }

        .box3 {
            background-color: yellow;
        }

        .box4 {
            background-color: red;
        }
        .parent {
            padding: 43px;
            margin: 34px;
            border: 2px solid purple;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>

</body>
</html>
