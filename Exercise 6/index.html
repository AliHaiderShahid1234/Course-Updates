<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            align-items: center;
            margin-top: 10px;
            margin-right: 18px;
            margin-left: 18px;
            padding: 15px;
            background-color: #f6f6f6;
            border: 1px solid rgb(199, 194, 194);
            border-radius: 5px;
        }

        .left {
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        ul {
            display: flex;
            justify-content: center;
            gap: 30px;
            align-items: center;
            list-style: none;
        }

        li {
            font-size: small;
            font-family: Arial, Helvetica, sans-serif;
        }

        .right {
            display: flex;
        }

        .download {
            background-color: #ffd741;
            padding: 10px;
            border: 1px solid transparent;
            border-radius: 10%;
        }
    </style>
</head>
<body>
    <nav>
        <div class="left">
            <img src="logo.png" alt="">
        </div>
            <ul>
                <li>Products</li>
                <li>Buy</li>
                <li>Renew</li>
                <li>Support</li>
                <li>Learn</li>
                <li>Company</li>
            </ul>
        <div class="right">
            <button class="download">Download</button>
            <p>🌐</p>
        </div>
    </nav>
</body>
</html>
