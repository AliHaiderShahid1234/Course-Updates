<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            align-items: center;
            margin-top: 10px;
            margin-right: 18px;
            margin-left: 18px;
            padding: 15px;
            background-color: #f6f6f6;
            border: 1px solid rgb(199, 194, 194);
            border-radius: 5px;
        }

        .left {
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        ul {
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <nav>
        <div class="left">
            <img src="logo.png" alt="">
        </div>
            <ul>
                <li>1</li>
                <li>1</li>
                <li>1</li>
                <li>1</li>
                <li>1</li>
                <li>1</li>
            </ul>
        <div class="right"></div>
    </nav>
</body>
</html>
