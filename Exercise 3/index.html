<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <style>
        * {
            background-color: grey;
            margin: 0;
            padding: 0;
        }
        .card {
            position: absolute;
            background-color: white;
            width: 120px;
            height: 195px;
            border: 3px solid transparent;
            border-radius: 5px;
        }

        .photo {
            width: 120px;
            height: 95px;
            border: 1px solid transparent;
            border-radius: 5px;
            overflow: hidden;
        }

        .img {
            width: 170px;
        }

        .tag {
            background-color: white;
            padding-left: 5px;
        }

        .tags {
            border: 0.25px solid lightgray;
            border-radius: 10px;
            background-color: white;
            font-size: 5px;
            padding: 5px;
            margin: 0;
            color: gray;
            font-weight: bold;
        }

        .heading {
            padding-top: 8px;
            padding-bottom: 8px;
            padding-left: 3px;
            background-color: white;
            font-family: "Google Sans", sans-serif;
            font-size: 12px;
            font-weight: bold;
            color: rgb(109, 109, 109);
        }

        .body {
            padding-top: 0;
            padding-left: 3px;
            width: 100px;
            height: 10px;
            background-color: white;
            font-size: 5px;
            text-overflow: ellipsis;
            font-family: "Google Sans", sans-serif;
        }

        .button {
            background-color: white;
            margin-top: 3px;
        }

        .continue {
            padding-top: 3px;
            padding-bottom: 3px;
            padding-left: 9px;
            padding-right: 9px;
            background-color: white;
            margin-top: 20px;
            margin-left: 35px;
            border: 1px solid transparent;
            border-radius: 50px;
            background-color: #469cf7f8;
            font-size: 5px;
            color: blue;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="photo">
            <img src="img.jpg" class="img">
        </div>
        <div class="tag">
            <span class="tags">Nature</span>
            <span class="tags">Sunset</span>
        </div>
        <p class="heading">
            Sunset Lake
        </p>
        <p class="body">
            Lorem ipsum dolor sit amet consectetur, adipisicing elit. Illo, ullam delectus. Reprehenderit voluptatem similique nulla sequi ab minus.
        </p>
        <div class="button">
            <button class="continue">Submit</button>
        </div>
    </div>
</body>
</html>
